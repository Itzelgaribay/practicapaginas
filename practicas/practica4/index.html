<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body>

<!--Centra todo el contenido de la página-->
<center>
        <h1>FORMULARIO DE REGISTRO</h1>
        <h2>Reservaciones</h2>
        <h3>Estrella Itzel Torres Garibay</h3>
    


    <form>

        <table border="0" cellpadding="8" cellspacing="0">


            <tr>
                <td>Ingresa tu nombre:</td>
                <td>
                    <input type="text" name="nombre">
                </td>
            </tr>

            <tr>
                <td>Ingresa tus apellidos:</td>
                <td>
                    <input type="text" name="apellidos">
                </td>
            </tr>

            <tr>
                <td>Ingresa tu edad:</td>
                <td>
                    <input type="number" name="edad">
                </td>
            </tr>

            <tr>
                <td>Ingresa tu correo:</td>
                <td>
                    <input type="email" name="correo">
                </td>
            </tr>

            <tr>
                <td>Ingresa género:</td>
                <td>
                    <input type="radio" name="genero" value="masculino"> M
                    <input type="radio" name="genero" value="femenino"> F
                </td>
            </tr>

            <tr>
                <td>Ingresa temas de interés:</td>
                <td>
                    <input type="checkbox" name="pasatiempo" value="computacion">
                    Computación

                    <input type="checkbox" name="pasatiempo" value="negocios">
                    Negocios

                    <input type="checkbox" name="pasatiempo" value="juegos">
                    Juegos

                    <input type="checkbox" name="pasatiempo" value="viajes">
                    Viajes
                </td>
            </tr>

            <tr>
                <td>Ingresa tu estado civil:</td>
                <td>
                    <select name="edo_civil">
                        <option value="casado">Casado/a</option>
                        <option value="soltero">Soltero/a</option>
                        <option value="divorciado">Divorciado/a</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Ingresa una contraseña:</td>
                <td>
                    <input type="password" name="contra">
                </td>
            </tr>

            <tr>
                <td>Algún comentario:</td>
                <td>
                    <textarea name="comentarios"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Enviar datos">
                </td>
            </tr>

        </table>

    </form>
    </center>

</body>

</html>
